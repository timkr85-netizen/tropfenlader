<title>Tropfen-Lader</title>
<style>
  :root {
    --bg: #161826;
    --bg-glow: #1b1e30;
    --accent: #9184d9;
    --accent-wash: rgba(145, 132, 217, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 640px 420px at 50% 12%, var(--bg-glow) 0%, transparent 70%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader {
    position: relative;
    width: 132px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 3.2s ease-in-out infinite;
  }

  .ping {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-wash) 0%, transparent 72%);
    animation: ping 3.2s ease-out infinite;
  }
  .ping.ping-2 { animation-delay: 1.6s; }

  .droplet-svg { position: relative; width: 84px; height: 84px; overflow: visible; }

  .wave-base { fill: var(--accent); opacity: 0.07; }

  .wave-group { animation: fill-level 7s ease-in-out infinite alternate; }
  .wave { fill: var(--accent); }
  .wave-back { opacity: 0.35; animation: drift 6s linear infinite; }
  .wave-front { opacity: 0.85; animation: drift 4s linear infinite reverse; }

  .droplet-outline {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.3;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(145, 132, 217, 0.45));
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes ping {
    0% { transform: scale(0.75); opacity: 0.5; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @keyframes fill-level {
    0% { transform: translateY(11px); }
    100% { transform: translateY(0); }
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-24px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loader, .ping, .wave-group, .wave-back, .wave-front {
      animation: none !important;
    }
    .wave-group { transform: translateY(3px); }
    .ping { opacity: 0.18; }
  }
</style>

<div class="loader" role="status" aria-label="Lädt">
  <div class="ping"></div>
  <div class="ping ping-2"></div>

  <svg class="droplet-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="dropletClip">
        <path d="M12 2C12 2 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 2 12 2Z"/>
      </clipPath>
    </defs>

    <path class="wave-base" clip-path="url(#dropletClip)"
          d="M0 2 L24 2 L24 22 L0 22 Z"/>

    <g clip-path="url(#dropletClip)">
      <g class="wave-group">
        <path class="wave wave-back"
              d="M0,4 C4,1.5 8,1.5 12,4 C16,6.5 20,6.5 24,4 C28,1.5 32,1.5 36,4 C40,6.5 44,6.5 48,4 L48,26 L0,26 Z"/>
        <path class="wave wave-front"
              d="M0,5 C4,2.5 8,2.5 12,5 C16,7.5 20,7.5 24,5 C28,2.5 32,2.5 36,5 C40,7.5 44,7.5 48,5 L48,26 L0,26 Z"/>
      </g>
    </g>

    <path class="droplet-outline"
          d="M12 2C12 2 5 11 5 15.5C5 19.09 8.13 22 12 22C15.87 22 19 19.09 19 15.5C19 11 12 2 12 2Z"/>
  </svg>
</div>
